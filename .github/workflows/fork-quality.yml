# Fork-only quality workflow for rjbarbour/pwsafe.
# Never part of an upstream pull request: upstream-bound branches are cut from upstream/master and
# must not contain .github/workflows/fork-*.yml or tools/quality/.
# Every job carries `if: github.repository == 'rjbarbour/pwsafe'`, so in any other repository the
# jobs are skipped and nothing is uploaded.
#
# coverage (PWS-05): builds coretest with GCC coverage instrumentation, runs Coretests and uploads
# gcovr 8.6 coverage for src/core and src/os (vendored pugixml and crypto/external excluded).
# Report only; no coverage gate here (the changed-line gate is the quality job below).
#
# quality (PWS-07): pull requests only. Fails only when new or changed code breaks the agreed limits
# (complexity, CRAP, changed-line coverage, clang-tidy, cppcheck, include layering); see
# tools/quality/README.md. Uploads clang-tidy and cppcheck SARIF to code scanning.
# The coverage flags live only in this workflow's configure step; CMakePresets.json and
# CMakeLists.txt are not changed.
name: Fork quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs only; every push to master keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (coretest, gcovr)
    if: github.repository == 'rjbarbour/pwsafe'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install packages
      run: |
        sudo apt-get update
        sudo ./Misc/setup-linux-dev-env.sh
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install gcovr==8.6
        "$RUNNER_TEMP/venv/bin/gcovr" --version

    - name: Configure (coverage flags)
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DUSE_INTERPROCEDURAL_OPTIMIZATION=OFF \
          -DCMAKE_C_FLAGS="--coverage -O0" \
          -DCMAKE_CXX_FLAGS="--coverage -O0" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
        echo "Coverage-relevant values in build/CMakeCache.txt:"
        grep -E '^(CMAKE_BUILD_TYPE|CMAKE_EXPORT_COMPILE_COMMANDS|USE_INTERPROCEDURAL_OPTIMIZATION|CMAKE_C_FLAGS|CMAKE_CXX_FLAGS|CMAKE_EXE_LINKER_FLAGS):' build/CMakeCache.txt
        ls -l build/compile_commands.json

    - name: Build coretest
      run: cmake --build build --target coretest

    - name: Run Coretests
      run: ctest --test-dir build -R Coretests --output-on-failure

    - name: gcovr coverage report
      env:
        GCOVR: ${{ runner.temp }}/venv/bin/gcovr
      run: |
        tools/quality/coverage.sh . build coverage
        {
          echo '### Coverage (coretest, gcovr 8.6)'
          echo '```'
          sed -n '1,/^branches:/p' coverage/coverage_summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artefact
      uses: actions/upload-artifact@v7.0.1
      with:
        # Named after the commit that was tested: the PR head on pull requests, the pushed commit otherwise.
        name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          coverage/coverage.json
          coverage/coverage.cobertura.xml
          coverage/coverage_summary.txt
        if-no-files-found: error

  quality:
    name: Quality gate (new and changed code)
    # Pull requests only: the gate judges a pull request's changes against its base.
    if: github.repository == 'rjbarbour/pwsafe' && github.event_name == 'pull_request'
    # Coverage comes from the PWS-05 coverage job's artefact for the same commit.
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload-sarif: clang-tidy and cppcheck results to code scanning
    defaults:
      run:
        shell: bash   # bash -eo pipefail, so `| tee` keeps a failing exit status
    env:
      BASE: origin/${{ github.base_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
      CPPCHECK_VERSION: '2.17.1'
      CPPCHECK_SHA256: bfd681868248ec03855ca7c2aea7bcb1f39b8b18860d76aec805a92a967b966c
      CLANG_TIDY: clang-tidy-18

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0   # the gate diffs against the merge base with the base branch
        persist-credentials: false

    - name: Install packages
      run: |
        sudo apt-get update
        sudo ./Misc/setup-linux-dev-env.sh
        sudo apt-get install -y clang-tidy-18
        CLANG_TIDY_DIFF=$(command -v clang-tidy-diff-18.py || echo /usr/lib/llvm-18/share/clang/clang-tidy-diff.py)
        test -f "$CLANG_TIDY_DIFF"
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install lizard==1.24.1 diff-cover==10.6.0
        {
          echo "CLANG_TIDY_DIFF=$CLANG_TIDY_DIFF"
          echo "LIZARD=$RUNNER_TEMP/venv/bin/lizard"
          echo "DIFF_COVER=$RUNNER_TEMP/venv/bin/diff-cover"
          echo "DIFF_QUALITY=$RUNNER_TEMP/venv/bin/diff-quality"
          echo "CPPCHECK=$RUNNER_TEMP/cppcheck/bin/cppcheck"
        } >> "$GITHUB_ENV"
        clang-tidy-18 --version
        "$RUNNER_TEMP/venv/bin/lizard" --version
        "$RUNNER_TEMP/venv/bin/diff-cover" --version

    - name: Build cppcheck ${{ env.CPPCHECK_VERSION }} (pinned source, SHA-256 checked)
      run: |
        # Ubuntu 24.04's cppcheck (2.13) has no native SARIF output, which came in 2.16.
        cd "$RUNNER_TEMP"
        curl -fsSL -o cppcheck.tar.gz "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
        echo "${CPPCHECK_SHA256}  cppcheck.tar.gz" | sha256sum -c -
        tar xzf cppcheck.tar.gz
        cmake -S "cppcheck-${CPPCHECK_VERSION}" -B cppcheck-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppcheck" -DFILESDIR="$RUNNER_TEMP/cppcheck/share/cppcheck"
        cmake --build cppcheck-build
        cmake --install cppcheck-build
        "$CPPCHECK" --version

    - name: Configure (compile commands)
      id: configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DUSE_INTERPROCEDURAL_OPTIMIZATION=OFF
        # Generated sources named in compile_commands.json (cppcheck refuses a
        # project whose files are missing; clang-tidy needs core_st.h).
        cmake --build build --target src/core/core_st.cpp src/core/core_st.h
        echo "Values in build/CMakeCache.txt:"
        grep -E '^(CMAKE_BUILD_TYPE|CMAKE_EXPORT_COMPILE_COMMANDS):' build/CMakeCache.txt
        ls -l build/compile_commands.json
        echo "Merge base with $BASE: $(git merge-base "$BASE" HEAD)"
        mkdir -p q

    - name: Download coverage artefact
      uses: actions/download-artifact@v8.0.1
      with:
        name: coverage-${{ github.event.pull_request.head.sha }}
        path: coverage

    - name: Include layering (decision-01 edge list)
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: |
        { echo '### Include layering (decision-01)'; echo; } >> "$GITHUB_STEP_SUMMARY"
        python3 tools/quality/layering.py | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Complexity, CRAP, changed-line coverage and duplication
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: |
        # Coverage thresholds live in tools/quality/coverage-gate.toml (line coverage enforced).
        python3 tools/quality/gate_changed.py --base "$BASE" --coverage coverage/coverage.json \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Changed-line coverage report (diff-cover, report only)
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: |
        # Annotated listing of uncovered changed lines; the gate itself is gate_changed.py above.
        "$DIFF_COVER" coverage/coverage.cobertura.xml --compare-branch="$BASE" \
          --include 'src/core/*' 'src/os/*' --format "markdown:q/diff-cover.md"
        {
          echo '### Changed-line coverage listing (diff-cover, report only)'
          echo
          sed 's/^# /#### /; s/^## /#### /' q/diff-cover.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: clang-tidy (changed lines; whole added files)
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: |
        python3 tools/quality/clang_tidy_gate.py --base "$BASE" --build build --out q --jobs "$(nproc)" \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: cppcheck (changed lines; diff-quality)
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      run: |
        python3 tools/quality/cppcheck_gate.py --base "$BASE" --build build --out q --jobs "$(nproc)" \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload clang-tidy SARIF to code scanning
      if: ${{ !cancelled() && hashFiles('q/clang-tidy.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v4.38.2   # same pin as codeql-analysis.yml
      with:
        sarif_file: q/clang-tidy.sarif
        category: clang-tidy

    - name: Upload cppcheck SARIF to code scanning
      if: ${{ !cancelled() && hashFiles('q/cppcheck.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v4.38.2   # same pin as codeql-analysis.yml
      with:
        sarif_file: q/cppcheck.sarif
        category: cppcheck

    - name: Upload gate reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: quality-gate-${{ github.event.pull_request.head.sha }}
        # Gate summaries and the changed-line SARIF only; the full-tree tool output stays on the runner.
        path: |
          q/*.md
          q/clang-tidy.sarif
          q/cppcheck.sarif
        if-no-files-found: warn
